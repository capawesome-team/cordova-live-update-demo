<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Live Update Demo</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: content: https://cdn.jsdelivr.net; media-src *; connect-src 'self' http://localhost:* https://*;"
    />

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"
    ></script>
    <script
      nomodule
      src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"
    />

    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <ion-app>
      <ion-header>
        <ion-toolbar>
          <ion-title>Live Update Demo</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <div id="badge">
          <span id="badge-label">–</span>
          <p>Current bundle</p>
        </div>

        <ion-card>
          <ion-card-content class="ion-no-padding">
            <ion-list lines="full">
              <ion-item>
                <ion-label>App version</ion-label>
                <ion-note slot="end" id="version-name">–</ion-note>
              </ion-item>
              <ion-item>
                <ion-label>Bundle ID</ion-label>
                <ion-note slot="end" id="bundle-id">–</ion-note>
              </ion-item>
              <ion-item>
                <ion-label>Channel</ion-label>
                <ion-note slot="end" id="channel">–</ion-note>
              </ion-item>
              <ion-item>
                <ion-label>Device ID</ion-label>
                <ion-note slot="end" id="device-id">–</ion-note>
              </ion-item>
              <ion-item lines="none">
                <ion-label>Last sync</ion-label>
                <ion-note slot="end" id="last-sync">Never</ion-note>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>

        <ion-button id="check-button" shape="round" expand="block" class="ion-margin-top">
          Check for updates
        </ion-button>
        <ion-button id="switch-channel-button" shape="round" expand="block" fill="outline">
          Switch channel
        </ion-button>
        <ion-button id="reset-button" shape="round" expand="block" fill="outline">
          Reset to built-in bundle
        </ion-button>
      </ion-content>
    </ion-app>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
