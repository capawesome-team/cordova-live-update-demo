name: Live Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Bump bundle label to v2
        run: sed -i "s/const BUNDLE_LABEL = 'v1';/const BUNDLE_LABEL = 'v2';/" www/js/index.js

      - name: Upload live update bundle
        env:
          CAPAWESOME_CLOUD_TOKEN: ${{ secrets.CAPAWESOME_CLOUD_TOKEN }}
        run: >
          npx @capawesome/cli apps:liveupdates:upload
          --app-id 1f3f8c0d-f220-460e-ac50-41269de3a105
          --path www
          --channel default
          --yes
